<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Launchly — Deploy from Git</title><link rel="stylesheet" href="/style.css"></head>
<body><main><p class="eyebrow">Launchly</p><h1>From Git to alive.</h1><p class="lede">Give Launchly a repository. It detects the stack, explains how it will run, and gives you a deployment plan before anything is built.</p>
<section class="panel" aria-labelledby="form-title"><h2 id="form-title">Create a deployment plan</h2><form id="plan-form"><label for="repository-url">Git repository URL</label><div class="form-row"><input id="repository-url" name="repository_url" type="url" placeholder="https://github.com/you/your-app" required autocomplete="url"><button type="submit">Inspect repository</button></div><p id="error" class="error" role="alert" hidden></p></form></section>
<section id="result" class="panel" aria-live="polite" hidden><div class="plan-title"><h2>Deployment plan</h2><span id="confidence" class="confidence"></span></div><dl><div><dt>Framework</dt><dd id="framework"></dd></div><div><dt>Language</dt><dd id="language"></dd></div><div><dt>Package manager</dt><dd id="package-manager"></dd></div><div><dt>Port</dt><dd id="port"></dd></div><div><dt>Build command</dt><dd id="build-command"></dd></div><div><dt>Start command</dt><dd id="start-command"></dd></div></dl><h3>Why this plan?</h3><ul id="rationale"></ul></section></main>
<script>
const form=document.querySelector('#plan-form'), button=form.querySelector('button'), error=document.querySelector('#error'), result=document.querySelector('#result');
const set=(id,value)=>document.querySelector(id).textContent=value;
form.addEventListener('submit',async event=>{event.preventDefault(); error.hidden=true; result.hidden=true; button.disabled=true; button.textContent='Inspecting…'; try { const response=await fetch('/api/plans',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository_url:form.repository_url.value})}); const data=await response.json(); if(!response.ok) throw new Error(data.error||'Unable to create a plan'); set('#framework',data.framework);set('#language',data.language);set('#package-manager',data.package_manager);set('#port',data.port);set('#build-command',data.build_command);set('#start-command',data.start_command);set('#confidence','Confidence: '+data.confidence); document.querySelector('#rationale').replaceChildren(...data.rationale.map(item=>{const li=document.createElement('li');li.textContent=item;return li;})); result.hidden=false; } catch (caught) { error.textContent=caught.message; error.hidden=false; } finally { button.disabled=false; button.textContent='Inspect repository'; }});
</script></body></html>
