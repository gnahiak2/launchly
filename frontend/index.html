<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launchly</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">STATIC DEPLOYMENTS</p><h1>Ship a website.</h1><p class="lede">Give Launchly a public Git repository with a root <code>index.html</code>. It checks the files, runs unprivileged Nginx, and verifies the result.</p></header>
    <section class="card">
      <form id="deploy-form">
        <label for="repository">Public Git repository URL</label>
        <input id="repository" type="url" placeholder="https://github.com/you/site" required>
        <label for="domain">Domain <span>(optional)</span></label>
        <input id="domain" type="text" placeholder="www.example.com">
        <div class="actions"><button id="inspect" type="button">Inspect repository</button><button id="deploy" type="submit" disabled>Deploy website</button></div>
      </form>
    </section>
    <section id="message" class="message" hidden></section>
    <section id="plan" class="card plan" hidden><h2>Deployment plan</h2><dl id="plan-details"></dl><h3>Why this plan?</h3><ul id="rationale"></ul></section>
    <section id="status" class="card" hidden><h2>Deployment status</h2><p><strong id="state"></strong> <span id="status-message"></span></p><p id="url"></p></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
